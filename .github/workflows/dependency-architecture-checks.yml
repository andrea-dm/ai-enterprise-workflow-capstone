name: Quality, Dependency, and Architecture Checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-dependency-architecture-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ruff
            command: uv run ruff check src/ tests/
          - name: pyright
            command: uv run pyright
          - name: deptry
            command: uv run deptry src/
          - name: tach
            command: uv run tach check

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install lint dependencies
        run: |
          rm -f uv.lock
          uv sync --no-install-project --group lint --default-index https://pypi.org/simple

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install test dependencies
        # Install the project and its runtime deps together with the test
        # dependency group so that all imports resolve correctly.
        run: |
          rm -f uv.lock
          uv sync --group test --default-index https://pypi.org/simple

      - name: Run pytest
        env:
          PYTHONPATH: src
        # `tests/test_embedder.py` and `tests/test_scoped.py` explicitly
        # evict the conftest stubs and require the real `torch` /
        # `transformers` packages. They are skipped here to keep the job
        # light; run them locally against a full dev environment.
        run: |
          uv run --no-sync pytest tests/ -q
