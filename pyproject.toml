[project]
name = "ai-enterprise-workflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "numpy>=2.2,<3",
    "pandas<3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_enterprise_workflow"]

# ═══════════════════════════════════════════════════════════ LINTING & FORMATTING ═══ #

[tool.pylint.format]
good-names = "wb,df,ws"

[tool.ruff]
target-version = "py312"
extend-exclude = ["data", "experimental", "deprecated", "scripts", "/resources"]

[tool.ruff.lint]
extend-select = [
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "FA", # flake8-future-annotations
    "I", # flake8-import-order
    "PIE", # flake8-pie
    "PYI", # flake8-pyi
    "PT", # flake8-pytest-style
    "Q", # flake8-quotes
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TD", # flake8-type-checking
    "E", # pycodestyle
    "F", # pyflakes
    "D1", # pydocstyle - undocumented public modules, classes, functions, methods
    "PL", # pylint
    "RUF", # ruff-specific rules
]

ignore = [
    "RUF100", # Unused `noqa` directive
    "RUF102", # Invalid rule code in `# noqa`
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1", "PLR0913", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true

[tool.deptry]
known_first_party = ["ai_enterprise_workflow"]

[dependency-groups]
lint = [
    "deptry",
    "pandas-stubs>=3.0.0.260204",
    "pyright[nodejs]>=1.1.409",
    "ruff>=0.15.4",
    "scipy-stubs>=1.13.0.0",
    "tach>=0.34.1",
]

test = [
    "pytest>=9.0.3",
    "pytest-mock>=3.14",
    "pytest-cov>=7.0.0",
    "hypothesis>=6.150.2",
    "requests>=2.33.0",
]

dev = [
    { include-group = "lint" },
    { include-group = "test" },
]

jupyter = [
    "matplotlib>=3.8",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.5",
    "nbconvert>=7.17.1",            # CVE: path traversal in cell attachments / HTMLExporter
]

docs = [
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.28",
    "griffe>=1.0",
]


# ════════════════════════════════════════════════════════════════════════ Testing ═══ #


[tool.pytest.ini_options]
testpaths = ["tests"]
# Enforce a strict marker policy
markers = [
    "unit: Quick tests, no I/O, no external dependencies.",
    "contract: Tests that mock external boundaries (e.g., APIs, DBs).",
    "integration: Tests that talk to real external services (requires network, creds).",
    "whitebox: Tests that inspect internal state or mock internals (use sparingly).",
    "slow: Tests that take a long time to run.",
]
